<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#201e1d">
<title>Gramola · Admin</title>
<link rel="icon" href="/assets/logo/simbolo-rojo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css?v=%%V%%">
<link rel="stylesheet" href="/editor.css?v=%%V%%">
</head>
<body>
<!-- Entrada -->
<main id="login" class="login" hidden>
  <div class="login-box">
    <img class="login-logo" src="/assets/logo/horizontal-claro.png" alt="gramola">
    <p class="kicker">Administración</p>
    <h1 id="login-title">Entra con<br><b>Touch ID.</b></h1>
    <div id="login-alta" hidden>
      <label class="lbl" for="key-name">Nombre de esta llave</label>
      <input id="key-name" class="inp" value="Mac" maxlength="60">
      <button id="btn-alta" class="btn red big">Dar de alta con Touch ID</button>
    </div>
    <button id="btn-login" class="btn red big" hidden>Entrar con Touch ID</button>
    <p id="login-msg" class="msg"></p>
  </div>
</main>

<!-- Portal -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="/assets/logo/horizontal-oscuro.png" alt="gramola"><span>GOD</span></div>
    <nav id="nav">
      <a data-v="resumen" href="#resumen"><i>01</i>Resumen</a>
      <a data-v="directo" href="#directo"><i>02</i>Salas en directo <b id="nav-live"></b></a>
      <a data-v="canciones" href="#canciones"><i>03</i>Canciones <b id="nav-songs"></b></a>
      <a data-v="creacion" href="#creacion"><i>04</i>Creación <b id="nav-jobs"></b></a>
      <a data-v="records" href="#records"><i>05</i>Récords</a>
      <a data-v="actividad" href="#actividad"><i>06</i>Actividad</a>
      <a data-v="servidor" href="#servidor"><i>07</i>Servidor</a>
      <a data-v="seguridad" href="#seguridad"><i>08</i>Seguridad</a>
    </nav>
    <div class="side-foot"><span id="ver"></span><button id="btn-out" class="link">Salir</button></div>
  </aside>
  <main id="view" class="view"></main>
</div>

<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<script src="/webauthn.js?v=%%V%%"></script>
<script src="/editor.js?v=%%V%%"></script>
<script src="/admin.js?v=%%V%%"></script>
</body>
</html>
