# Gramola detrás de Apache (Plesk: «Configuración de Apache y nginx → Directivas adicionales para HTTPS»).
# Todo va al servidor de Node, incluido el WebSocket de /ws (necesita mod_proxy_wstunnel y mod_rewrite).
ProxyPreserveHost On
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/ws$ ws://127.0.0.1:8877/ws [P,L]
# Los retos de Let's Encrypt los sirve Plesk, no Node
ProxyPass /.well-known !
ProxyPass /ws ws://127.0.0.1:8877/ws
ProxyPass / http://127.0.0.1:8877/
ProxyPassReverse / http://127.0.0.1:8877/
ProxyTimeout 3600
# El WAF (ModSecurity) en modo detección para la API, por si bloquea el POST de récords
<IfModule mod_security2.c>
  <LocationMatch "^/api/">
    SecRuleEngine DetectionOnly
  </LocationMatch>
</IfModule>
